[project]
name = "mbf-singlecell-plotter"
version = "0.1.0"
description = "A helper to make sense of scRNAseq"
requires-python = ">=3.13"
dependencies = [
 "anndata>=0.12.0",
 "dppd>=0.31",
 "dppd-plotnine>=0.2.9",
 "natsort>=8.4.0",
 "numpy>=2.2.3",
 "pandas>=2.0.1",
 "pillow>=12.0.0",
 "plotnine>=0.15.0",
 "pyarrow>=25.0.1",
 "scanpy>=1.12.3",
 "scikit-image>=0.26.0",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9",
    "scikit-image>=0.24",
    "scipy>=1.14",
    "ty>=0.0.1a9",
    "pypipegraph2",
]

[tool.ty.rules]
# Advisory mode: all rules are warnings while type coverage is being built up.
# Promote rules to "error" as they become clean.
all = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
